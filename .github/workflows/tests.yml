name: tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

jobs:
  test:
    name: go (vet+unit+coverage) + schema (pytest) + runtime (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # `make test` now runs `go-test` first (anon/ vet + build + unit suite
      # with the GO_COVER_MIN floor) before the schema/runtime suites.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: anon/go.mod
          cache: false   # anon/ is stdlib-only (no go.sum)

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python deps
        run: |
          python -m venv tests/.venv
          tests/.venv/bin/pip install --upgrade pip
          tests/.venv/bin/pip install -r tests/requirements.txt

      - name: Install Node deps
        run: npm ci

      - name: Run full test suite
        run: make test

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: tests/runtime/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # The anond integration suite asserts the end-to-end no-leak / trusted-split /
  # detok-bijection invariants — the security guarantees that previously ran
  # ONLY in t.Skip()'d tests (H5). They need a live ClickHouse; this job stands
  # one up and runs the single-cluster subset (the cross-cluster cases need the
  # `cl otel` wrapper and stay local-only).
  go-integration:
    name: go integration (no-leak / trusted-split vs live ClickHouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NON-BLOCKING for now: the suite + harness are ready, but the runner ↔
    # service-container connectivity to the native port still needs sorting in
    # this CI environment (the connect smoke-test below dumps diagnostics).
    # The unit gate in the `test` job is the enforced gate. Flip this to false
    # (remove continue-on-error) once the smoke-test goes green.
    continue-on-error: true

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "wget -q -O - http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: anon/go.mod
          cache: false

      - name: Install clickhouse-client
        run: |
          curl -fsSL https://clickhouse.com/ -o /tmp/ch-install.sh
          sh /tmp/ch-install.sh        # downloads the single ./clickhouse binary
          sudo install -m 0755 ./clickhouse /usr/local/bin/clickhouse
          # the multicall binary dispatches on argv[0]; alias the client name the
          # integration harness invokes.
          sudo ln -sf /usr/local/bin/clickhouse /usr/local/bin/clickhouse-client
          clickhouse-client --version

      - name: Smoke-test ClickHouse connectivity
        run: |
          # Direct --host/--port on IPv4 (the mapped service port isn't on ::1) —
          # no named-connection config to get wrong. Wait until it answers.
          for i in $(seq 1 30); do
            clickhouse-client --host 127.0.0.1 --port 9000 --query "SELECT version()" && break
            echo "waiting for clickhouse ($i)..."; sleep 2
          done
          if ! clickhouse-client --host 127.0.0.1 --port 9000 --query "SELECT 'clickhouse reachable'"; then
            echo "::group::connectivity diagnostics"
            echo "--- docker ps ---";        docker ps -a || true
            echo "--- listening sockets ---"; (command -v ss >/dev/null && sudo ss -ltnp) || netstat -ltnp || true
            echo "--- http ping :8123 ---";   curl -sS -m 5 http://127.0.0.1:8123/ping; echo
            echo "--- verbose connect :9000 ---"; clickhouse-client --host 127.0.0.1 --port 9000 --query "SELECT 1" 2>&1 | head -40; echo "exit=$?"
            echo "::endgroup::"
            exit 1
          fi

      - name: Run anond integration suite (single-cluster)
        env:
          # ANON_TEST_CMD bypasses the named-connection config (see integration_test.go)
          ANON_TEST_CMD: clickhouse-client --host 127.0.0.1 --port 9000
        run: cd anon && go test ./internal/integration/ -run 'TestPipeline|TestSafetyDecoy' -v
